[project]
name = "emergency-halt"
version = "0.1.0"
description = "Adjudicated emergency pause: GenLayer Intelligent Contract that adjudicates exploit proofs and emits a self-expiring freeze to an EVM target."
requires-python = ">=3.12,<3.13"
dependencies = [
    "genlayer-test[sim]==0.28.0",
    "genvm-linter==0.10.0",
    "eth-account==0.13.3",
    "eth-utils==5.0.0",
    "requests==2.31.0",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    # In-process EVM so the Solidity target is executed, not merely read. Pinned to the
    # newest release whose metadata accepts the eth-utils==5.0.0 / eth-account==0.13.3
    # pins above; 0.14.0b1 requires eth-utils>=6 and would force those pins up.
    "eth-tester[py-evm]==0.13.0b1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
